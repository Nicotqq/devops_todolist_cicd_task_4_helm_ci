name: python-deployment

run-name: ${{ github.actor }} - ${{ github.ref_name}} -${{ github.sha }}

on:
  push:
    branches: ["your_name"]
  pull_request:
    branches: ["your_name"]

env:
  PythonVersion: 3.8
  DockerImageName: todoapp

jobs:
  python-ci:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ./src
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PythonVersion }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PythonVersion }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install coverage flake8
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python manage.py test

      - name: Generate Report
        run: |
          coverage run --source='.' manage.py test
          coverage report

      - name: Linting
        run: |
          flake8 . --show-source --statistics --exit-zero

      - name: Check Complexity
        run: |
          flake8 . --exit-zero --max-complexity=6

      - name: Upload python artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-artifacts
          path: .

  docker-ci:
    runs-on: ubuntu-latest
    if: ${{ github.ref_name == 'your_name' }}
    needs: python-ci
    steps:

    - name: download python artifacts
      uses: actions/download-artifact@v4
      with:
        name: python-artifacts
        path: .

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        push: true
        context: ./src
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DockerImageName }}:${{ github.sha }}
  
  helm-ci: 
    runs-on: ubuntu-latest
    needs: python-ci
    if: github.ref_name == 'your_name'
    name: Helm CI
    steps:

    - uses: actions/download-artifact@v4
    with:
      name: helm-artifacts
      path: .

      name: set up Helm
      uses: azure/setup-helm@v4.2.0

      name: Lint helm
      run: helm lint ${{ env.HelmChartPath }}

      name: Template Helm
      run: helm template todoapp ${{ env.HelmChartPath }}

      name: Create Helm package directory
      run: mkdir -p ./helm-package

      name: Package Helm
      run: helm package ${{ env.HelmChartPath }} --destination ./helm-package

      name: Upload Helm Artifact
      uses: action/upload-artifact@v4
      with: 
        name: helm package
        path: ./helm-package/*.tgz
        if-no-files-found: error